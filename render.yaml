services:
  - type: web
    name: launchwise-ai-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite:///./launchwise.db
      - key: IS_DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
